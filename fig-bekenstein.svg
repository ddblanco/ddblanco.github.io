<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" font-family="Georgia, 'Times New Roman', serif">
  <title>Energy density in the Rindler wedge and the Bekenstein bound</title>
  <rect width="400" height="210" fill="#ffffff"/>
  <!-- Rindler wedge x > |t| -->
  <polygon points="120,130 230,20 390,20 390,200 190,200" fill="#e8eef7"/>
  <line x1="120" y1="130" x2="230" y2="20" stroke="#8a9bb5" stroke-width="1.2"/>
  <line x1="120" y1="130" x2="190" y2="200" stroke="#8a9bb5" stroke-width="1.2"/>
  <!-- axes -->
  <line x1="20" y1="130" x2="392" y2="130" stroke="#333" stroke-width="1.2"/>
  <line x1="120" y1="200" x2="120" y2="12" stroke="#333" stroke-width="1.2"/>
  <path d="M392 130 l-7 -3.5 v7z M120 12 l-3.5 7 h7z" fill="#333"/>
  <text x="380" y="148" font-size="15" font-style="italic" fill="#333">x</text>
  <text x="106" y="22" font-size="15" font-style="italic" fill="#333">t</text>
  <!-- modular weight 2πx -->
  <line x1="120" y1="130" x2="385" y2="52" stroke="#555" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="330" y="58" font-size="14" font-style="italic" fill="#555">2πx</text>
  <!-- energy density: positive bump followed by a negative dip -->
  <path d="M135 130 C160 130 165 80 190 80 C215 80 220 130 245 130 Z" fill="#c0392b" fill-opacity=".22" stroke="#c0392b" stroke-width="1.8"/>
  <path d="M245 130 C265 130 270 160 290 160 C310 160 315 130 335 130 Z" fill="#1f4e8c" fill-opacity=".22" stroke="#1f4e8c" stroke-width="1.8"/>
  <text x="184" y="72" font-size="17" fill="#c0392b">+</text>
  <text x="285" y="180" font-size="19" fill="#1f4e8c">−</text>
  <text x="212" y="100" font-size="13" font-style="italic" fill="#333">⟨T<tspan font-size="9" dy="3">00</tspan><tspan dy="-3">⟩</tspan></text>
  <!-- inequality -->
  <text x="18" y="50" font-size="15" font-style="italic" fill="#1c1c1e">ΔS ≤ ΔK</text>
  <text x="18" y="74" font-size="13" font-style="italic" fill="#1c1c1e">K = 2π∫x T<tspan font-size="9" dy="3">00</tspan></text>
</svg>
